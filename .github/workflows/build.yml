name: build

on:
  push:
  pull_request:

jobs:
  test:
    name: native tests + generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('core/platformio.ini') }}
      - run: pip install platformio==6.2.0 pillow==13.0.0  # pinned: gen_figma_assets output depends on the resampler
      - name: Generated files are up to date
        run: |
          python tools/gen_tokens.py --check
          python tools/gen_docs.py --check
          python tools/gen_figma_assets.py --check
          python tools/gen_assets.py --check
      - name: Unit tests (host)
        working-directory: core
        run: pio test -e native

  ui-sim:
    name: UI simulator vs Figma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools (SDL2 so the --live window also compiles)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libsdl2-dev
          pip install pillow==13.0.0
      - name: Render every UI scene and compare with Figma
        run: python tools/ui_sim/run.py
      - name: Report in the job summary
        if: always()
        run: cat tools/ui_sim/out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-sim
          path: tools/ui_sim/out

  site:
    name: manual site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the manual from docs/
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: manual-site
          path: site/dist

  build:
    name: ${{ matrix.project }} / ${{ matrix.env || 'all' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: core, env: core }
          - { project: core, env: core-hello }
          - { project: core, env: hello-ui }
          - { project: camera, env: cam1 }
          - { project: camera, env: cam2 }
          - { project: camera, env: cam3 }
          - { project: camera, env: cam4 }
          - { project: camera, env: cam-hello }
          - { project: steps, env: "" }  # all bring-up step envs in one job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git hash for the boot banner
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.project }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
      - run: pip install platformio==6.2.0
      - name: Build
        working-directory: ${{ matrix.project }}
        run: pio run ${{ matrix.env && format('-e {0}', matrix.env) || '' }}
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env || matrix.project }}
          path: |
            ${{ matrix.project }}/.pio/build/${{ matrix.env || '*' }}/firmware.bin
            ${{ matrix.project }}/.pio/build/${{ matrix.env || '*' }}/firmware.factory.bin
          if-no-files-found: warn
