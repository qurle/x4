<text x="95.40" y="98.40" class="sm" text-anchor="start">glue E1, E2, E3 on top of each other (9 mm), then onto</text>
<text x="95.40" y="102.40" class="sm" text-anchor="start">the door's inside face around the dashed Core outline:</text>
<text x="95.40" y="106.40" class="sm" text-anchor="start">6 mm rim left/right, 4 mm top/bottom.</text>
<text x="95.40" y="110.40" class="sm" text-anchor="start">The notches leave room for the Core's ports and cables.</text>
