; x4cam step-by-step bring-up. One tiny firmware per step, simplest first. Guide: docs/STEPS.md.
;   pio run -e s01-hello -t upload && pio device monitor -e s01-hello
; Each step is one short main.cpp in src/sNN_*/. They share only include/*.h (pins, the 5 V-off
; routine, network names). No LVGL, no shared/ library, no config system: read them top to bottom.
;
; Core (CoreS3-SE) steps                 Camera (Unit CamS3-5MP) steps
;   s01-hello   serial + screen hello      s08-cam-alone  sensor ID + 5 MP JPEG, own WiFi
;   s02-power   5 V output really off      s09-cam        joins the Core's WiFi (as camera 1)
;   s03-sd      microSD write/read         s10-cam1..4    serves /capture on the Core's WiFi
;   s04-touch   touch dots
;   s05-rail    Core powered from the rail
;   s06-button  Mini Button on G1
;   s07-flash   one guarded 50 ms flash
;   s09-core-ap Core WiFi, sees cameras
;   s10-core-shot  button -> photos from every camera online -> SD
; Steps 12 and 13 are the real firmware: core/ (hello-ui, core) and camera/ (cam1..cam4).

[platformio]
boards_dir = ../camera/boards
default_envs = s01-hello, s02-power, s03-sd, s04-touch, s05-rail, s06-button, s07-flash, s09-core-ap, s10-core-shot, s08-cam-alone, s09-cam, s10-cam1, s10-cam2, s10-cam3, s10-cam4

[versions]
; Same toolchain and M5Unified as core/ and camera/ (docs/FIRMWARE.md#pinned-versions).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
lib_m5unified = https://github.com/m5stack/M5Unified.git#0.2.29
lib_m5gfx = https://github.com/m5stack/M5GFX.git#0.2.36

[common]
platform = ${versions.platform}
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags = -std=gnu++17 -Iinclude -Wall -DCORE_DEBUG_LEVEL=1

[core]
extends = common
board = m5stack-cores3
upload_speed = 1500000
lib_deps =
  ${versions.lib_m5gfx}
  ${versions.lib_m5unified}

[cam]
extends = common
board = m5stack-unitcams3
upload_speed = 921600

[env:s01-hello]
extends = core
build_src_filter = +<s01_hello/>

[env:s02-power]
extends = core
build_src_filter = +<s02_power/>

[env:s03-sd]
extends = core
build_src_filter = +<s03_sd/>

[env:s04-touch]
extends = core
build_src_filter = +<s04_touch/>

[env:s05-rail]
extends = core
build_src_filter = +<s05_rail/>

[env:s06-button]
extends = core
build_src_filter = +<s06_button/>

[env:s07-flash]
extends = core
build_src_filter = +<s07_flash/>

[env:s09-core-ap]
extends = core
build_src_filter = +<s09_core_ap/>

[env:s10-core-shot]
extends = core
build_src_filter = +<s10_core_shot/>

[env:s08-cam-alone]
extends = cam
build_src_filter = +<s08_cam_alone/>

[env:s09-cam]
extends = cam
build_src_filter = +<s09_cam/>
build_flags = ${common.build_flags} -DCAM_ID=1

[env:s10-cam1]
extends = cam
build_src_filter = +<s10_cam/>
build_flags = ${common.build_flags} -DCAM_ID=1

[env:s10-cam2]
extends = cam
build_src_filter = +<s10_cam/>
build_flags = ${common.build_flags} -DCAM_ID=2

[env:s10-cam3]
extends = cam
build_src_filter = +<s10_cam/>
build_flags = ${common.build_flags} -DCAM_ID=3

[env:s10-cam4]
extends = cam
build_src_filter = +<s10_cam/>
build_flags = ${common.build_flags} -DCAM_ID=4
