; x4 camera firmware (M5Stack Unit CamS3-5MP, U174-B). Build: `pio run`, flash camera 2:
;   pio run -e cam2 -t upload      (Grove-to-USB-C adapter; G0 to GND before power-up if needed)
;
; Environments
;   cam1..cam4  full firmware for camera N: joins the Core AP, registers, shoots on trigger
;   cam-hello   Stage 0: joins your home WiFi (secrets.h), prints chip/PSRAM/sensor ID, benchmarks
;               capture at every size including full 5 MP, serves /info and /capture
;
; Board settings follow M5's Arduino guide for this unit (USB CDC on boot = enabled, PSRAM = OPI)
; with a local board file (camera/boards/m5stack-unitcams3.json): 16 MB QIO flash + 8 MB OPI PSRAM.

[platformio]
default_envs = cam1, cam2, cam3, cam4, cam-hello
boards_dir = boards

[x4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
lib_json = https://github.com/bblanchon/ArduinoJson.git#v7.4.3

[cambase]
platform = ${x4.platform}
board = m5stack-unitcams3
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts = pre:../tools/pio_git_rev.py
lib_deps =
  symlink://../shared
  ${x4.lib_json}
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
  -std=gnu++17
  -Iinclude
  -DX4_CAMERA=1
  -DCORE_DEBUG_LEVEL=1
  -Wall
  -Wno-missing-field-initializers

[env:cam1]
extends = cambase
build_flags = ${cambase.build_flags} -DX4_CAM_ID=1

[env:cam2]
extends = cambase
build_flags = ${cambase.build_flags} -DX4_CAM_ID=2

[env:cam3]
extends = cambase
build_flags = ${cambase.build_flags} -DX4_CAM_ID=3

[env:cam4]
extends = cambase
build_flags = ${cambase.build_flags} -DX4_CAM_ID=4

[env:cam-hello]
extends = cambase
build_flags = ${cambase.build_flags} -DX4_CAM_ID=0 -DX4_CAM_HELLO=1
