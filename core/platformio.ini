; x4 Core firmware (M5Stack CoreS3-SE). Build: `pio run`, flash: `pio run -e core -t upload`.
; Every dependency is pinned. Why these versions: docs/FIRMWARE.md#pinned-versions and
; docs/DECISIONS.md (ADR-003 pioarduino).
;
; Environments
;   core       full firmware: SoftAP, cameras, shooting flow, UI, web debug page
;   core-hello Stage 0 bring-up: banner, power-safety assertion, touch/SD/button/flash tests, no WiFi
;   hello-ui   LVGL smoke test: black screen, "Four Eyes", eased fade + slide, tap to replay
;   native     host unit tests for shared/ (pio test -e native)

[platformio]
default_envs = core, core-hello, hello-ui

[x4]
; pioarduino = Arduino-ESP32 3.3.x on ESP-IDF 5.5. Needed by the camera (MEGA_CCM driver) and kept
; identical on the Core so both firmwares share one toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
lib_m5unified = https://github.com/m5stack/M5Unified.git#0.2.29
lib_m5gfx = https://github.com/m5stack/M5GFX.git#0.2.36
lib_lvgl = https://github.com/lvgl/lvgl.git#v9.6.0
lib_json = https://github.com/bblanchon/ArduinoJson.git#v7.4.3

[esp32base]
platform = ${x4.platform}
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
extra_scripts = pre:../tools/pio_git_rev.py
lib_deps =
  symlink://../shared
  ${x4.lib_m5gfx}
  ${x4.lib_m5unified}
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
  -std=gnu++17
  -Iinclude
  -DX4_CORE=1
  -DCORE_DEBUG_LEVEL=1
  -Wall
  -Wno-missing-field-initializers

[env:core]
extends = esp32base
lib_deps =
  ${esp32base.lib_deps}
  ${x4.lib_lvgl}
  ${x4.lib_json}
build_flags =
  ${esp32base.build_flags}
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DX4_APP_FULL=1
build_src_filter = +<*> -<hello_ui/>

[env:core-hello]
extends = esp32base
lib_deps =
  ${esp32base.lib_deps}
  ${x4.lib_lvgl}
  ${x4.lib_json}
build_flags =
  ${esp32base.build_flags}
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DX4_APP_HELLO=1
build_src_filter = +<*> -<hello_ui/>

[env:hello-ui]
extends = esp32base
lib_deps =
  ${esp32base.lib_deps}
  ${x4.lib_lvgl}
build_flags =
  ${esp32base.build_flags}
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DX4_APP_HELLO_UI=1
build_src_filter = -<*> +<hello_ui/> +<display/> +<ui/fonts/> +<hw/> +<log/>

[env:native]
platform = https://github.com/platformio/platform-native.git#v1.2.1
test_framework = unity
lib_deps =
  symlink://../shared
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -Wno-missing-field-initializers
test_build_src = no
